replicaCount: 1

image:
  # see https://hub.docker.com/repository/docker/baris1892/datascientest-cast-service/general
  repository: baris1892/datascientest-cast-service
  pullPolicy: Always

  # Overrides the image tag whose default is the chart appVersion.
  tag: "develop"

env:
  DATABASE_URI: "postgresql://cast_db_username:cast_db_password@cast-service-db/cast_db"

nameOverride: "cast-service"
fullnameOverride: "cast-service"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: { }

podSecurityContext: { }

securityContext: { }

service:
  type: NodePort
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: { }
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: [ ]

resources: { }

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: { }

tolerations: [ ]

affinity: { }

postgres:
  image: postgres:12.1-alpine
  pullPolicy: IfNotPresent
  username: cast_db_username
  password: cast_db_password
  db: cast_db
  storage: 1Gi
